# Create a namespace for the app
apiVersion: v1
kind: Namespace
metadata:
  name: kiada
---
# Create a deployment for the app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiada
  namespace: kiada
  labels:
    app: kiada
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kiada
  template:
    metadata:
      labels:
        app: kiada
    spec:
      containers:
        - name: kiada-container
          image: kiada:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "70m"  # 0.070 CPU cores
              memory: "128Mi"
            limits:
              cpu: "100m"  # 0.100 CPU cores
              memory: "256Mi"