# Create a deployment for the app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiada
  namespace: kiada
  labels:
    app: kiada
spec:
  replicas: 3   # We want 3 copies/replicas of our application running
  selector:
    matchLabels:
      app: kiada
  template:
    metadata:
      labels:
        app: kiada
    spec:
      initContainers:
        - name: kiada-init
          image: avr2002/kiada-init:0.1
          args:
          - "11"  # Run init for 11 seconds

          # Defining `traffic-meter` as a Kubernetes native sidecar container
          # And defining this container before `network-checker` to ensure it
          # captures the network checker's traffic.
        - name: traffic-meter
          image: avr2002/kiada-network-traffic-meter:0.1
          restartPolicy: Always

        - name: network-check
          image: avr2002/kiada-network-connectivity-checker:0.1
          args:
          - "1.1.1.2"

      containers:
        - name: kiada
          image: avr2002/kiada:0.1
          imagePullPolicy: IfNotPresent   # Values can be Always, IfNotPresent, Never
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "70m"      # 0.070 CPU cores
              memory: "128Mi"
            limits:
              cpu: "100m"     # 0.100 CPU cores
              memory: "256Mi"

        - name: envoy
          image: avr2002/kiada-ssl-proxy:0.1
          ports:
          - name: https
            containerPort: 8443
          - name: admin
            containerPort: 9901
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
